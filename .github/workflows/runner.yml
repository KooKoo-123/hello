name: runner

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: [self-hosted, kosa-label]

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        
      - name: hello 폴더 변경
        run: cd hello

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Maven 빌드
        run: mvn clean package

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드
        run: |
          docker build -t ${{secrets.DOCKERHUB_USERNAME}}/hello:latest .

      - name: Docker 이미지 Push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello:latest

      - name: 배포
        run: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$DOCKERHUB_USERNAME/hello:latest"
            docker rm -f hello_app || true
            docker run -d \
              --name hello_app \
              --restart unless-stopped \
              -p 80:8080 \
              "$DOCKERHUB_USERNAME/hello:latest"
