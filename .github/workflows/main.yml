name: 전자정부 프레임워크 빌드 및 배포

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 루트 확인
        run: ls -la

      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 체크아웃 후 hello 폴더 확인
        run: ls -la hello

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Maven 빌드
        working-directory: ./hello
        run: mvn clean package

      - name: SSH 개인 키 설정
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: EC2 서버 지문 등록
        run: ssh-keyscan -H -t ed25519 13.210.186.99 >> ~/.ssh/known_hosts

      - name: WAR 파일을 EC2 Tomcat에 배포
        working-directory: ./hello
        run: |
          scp -i ~/.ssh/id_rsa target/hello-1.0.0.war ubuntu@13.210.186.99:~/ROOT.war
          ssh -i ~/.ssh/id_rsa ubuntu@13.210.186.99 << 'EOF'
            cp ~/ROOT.war /opt/tomcat/webapps/ROOT.war
          EOF
