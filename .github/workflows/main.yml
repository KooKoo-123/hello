name: 전자정부 프레임워크를 사용하여 빌드 및 배포

on:
  push:
    branches:
      - main # 주석 : main 브랜치에 push가 되면 actions가 동작함

jobs:
  build:
    runs-on: ubuntu-latest # 어떤 운영체제 버전에서 실행하는지 설정

    steps:
    - name: 소스 check out
      uses: actions/checkout@v3

    - name : 메이븐 빌드
      working-directory: ./hello
      run: mvn clean package

    - name: 도커 이미지 빌드
      working-directory: ./hello
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/hello:latest .

    - name: Docker Hub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker 이미지 Push
      run: docker push ${{ secrets.DOCKER_USERNAME }}/hello:latest
