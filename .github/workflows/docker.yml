name: Docker 이미지 빌드 및 배포

on:
  push:
    branches:
      - main

env:
  SERVER_IP: 13.210.186.99

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Maven 빌드
        working-directory: ./hello
        run: mvn clean package

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드
        working-directory: ./hello
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hello:latest .

      - name: Docker 이미지 Push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello:latest

      - name: EC2에 배포
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ env.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            sudo docker pull "$DOCKERHUB_USERNAME/hello:latest"
            sudo docker rm -f hello_app || true
            sudo docker run -d --name hello_app --restart unless-stopped -p 8080:8080 "$DOCKERHUB_USERNAME/hello:latest"
